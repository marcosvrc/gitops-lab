apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webapps.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: WebApp
    plural: webapps
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                  description: Imagem do container.
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 5
                servicePort:
                  type: integer
                  description: Porta de acesso do Service.
                  default: 80
                  minimum: 1
                  maximum: 65535
                containerPort:
                  type: integer
                  description: Porta interna do container.
                  default: 80
                  minimum: 1
                  maximum: 65535
                healthCheckPath:
                  type: string
                  description: Caminho HTTP usado pelo readinessProbe.
                  default: "/"
                config:
                  type: object
                  description: Pares chave/valor expostos como variaveis de ambiente via ConfigMap.
                  default: {}
                  additionalProperties:
                    type: string
                cpuLimit:
                  type: string
                  description: Limite de CPU quando size nao estiver definido.
                  default: "250m"
                  enum:
                    - "250m"
                    - "500m"
                    - "1000m"
                memoryLimit:
                  type: string
                  description: Limite de memoria quando size nao estiver definido.
                  default: "128Mi"
                  enum:
                    - "128Mi"
                    - "256Mi"
                    - "512Mi"
                size:
                  type: string
                  description: Perfil de recursos que prevalece sobre os limites individuais.
                  enum:
                    - small
                    - medium
                    - large
              required:
                - image
