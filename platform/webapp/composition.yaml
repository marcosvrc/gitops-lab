apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: webapp-local
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: WebApp
  mode: Pipeline
  pipeline:
    - step: create-webapp
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: deployment
            base:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                labels:
                  app.kubernetes.io/part-of: gitops-lab
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: placeholder
                template:
                  metadata:
                    labels:
                      app: placeholder
                  spec:
                    containers:
                      - name: web
                        image: nginx:1.28
                        ports:
                          - containerPort: 80
                        envFrom:
                          - configMapRef:
                              name: placeholder
                        readinessProbe:
                          httpGet:
                            path: /
                            port: 80
                          initialDelaySeconds: 2
                          periodSeconds: 5
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            cpu: 250m
                            memory: 128Mi
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.matchLabels.app

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.metadata.labels.app

              - type: FromCompositeFieldPath
                fromFieldPath: spec.image
                toFieldPath: spec.template.spec.containers[0].image

              - type: FromCompositeFieldPath
                fromFieldPath: spec.replicas
                toFieldPath: spec.replicas

              - type: FromCompositeFieldPath
                fromFieldPath: spec.containerPort
                toFieldPath: spec.template.spec.containers[0].ports[0].containerPort

              - type: FromCompositeFieldPath
                fromFieldPath: spec.containerPort
                toFieldPath: spec.template.spec.containers[0].readinessProbe.httpGet.port

              - type: FromCompositeFieldPath
                fromFieldPath: spec.healthCheckPath
                toFieldPath: spec.template.spec.containers[0].readinessProbe.httpGet.path

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.spec.containers[0].envFrom[0].configMapRef.name

              - type: FromCompositeFieldPath
                fromFieldPath: spec.cpuLimit
                toFieldPath: spec.template.spec.containers[0].resources.limits.cpu

              - type: FromCompositeFieldPath
                fromFieldPath: spec.memoryLimit
                toFieldPath: spec.template.spec.containers[0].resources.limits.memory

              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.template.spec.containers[0].resources.requests.cpu
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: map
                    map:
                      small: "50m"
                      medium: "100m"
                      large: "250m"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.template.spec.containers[0].resources.limits.cpu
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: map
                    map:
                      small: "250m"
                      medium: "500m"
                      large: "1000m"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.template.spec.containers[0].resources.requests.memory
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: map
                    map:
                      small: "64Mi"
                      medium: "128Mi"
                      large: "256Mi"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.template.spec.containers[0].resources.limits.memory
                policy:
                  fromFieldPath: Optional
                transforms:
                  - type: map
                    map:
                      small: "128Mi"
                      medium: "256Mi"
                      large: "512Mi"

            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Available
                  status: "True"

          - name: service
            base:
              apiVersion: v1
              kind: Service
              spec:
                type: ClusterIP
                selector:
                  app: placeholder
                ports:
                  - name: http
                    port: 80
                    targetPort: 80
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.app

              - type: FromCompositeFieldPath
                fromFieldPath: spec.servicePort
                toFieldPath: spec.ports[0].port

              - type: FromCompositeFieldPath
                fromFieldPath: spec.containerPort
                toFieldPath: spec.ports[0].targetPort

            readinessChecks:
              - type: NonEmpty
                fieldPath: spec.clusterIP

          - name: config
            base:
              apiVersion: v1
              kind: ConfigMap
              data: {}
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace

              - type: FromCompositeFieldPath
                fromFieldPath: spec.config
                toFieldPath: data

            readinessChecks:
              - type: None
