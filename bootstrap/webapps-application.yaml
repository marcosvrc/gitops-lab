apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/marcosvrc/gitops-lab.git
    targetRevision: main
    path: apps/webapps
  destination:
    server: https://kubernetes.default.svc
    namespace: webapps
  syncPolicy:
    automated:
      automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      